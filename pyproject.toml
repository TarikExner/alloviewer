[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "alloviewer"
version = "0.1.0"
description = "Analysis tools for flow cytometry, image analysis, gating, clustering, plotting, reports, and API access."
readme = "README.md"
requires-python = ">=3.10,<=3.15"
license = { text = "MIT" }

authors = [
  { name = "Tarik Exner", email = "tarik.exner@gmail.com" }
]

dependencies = [
  # Core scientific stack
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",

  # Plotting / figures
  "matplotlib>=3.7",
  "seaborn>=0.13",

  # Image processing
  "opencv-python>=4.8",
  "scikit-image>=0.21",
  "tifffile>=2023.7.10",

  # Deep learning
  "torch>=2.0",

  # Data / file formats
  "h5py>=3.8",

  # Progress bars
  "tqdm>=4.65",

  # Flow cytometry
  "flowio<=1.0.3",
  "flowutils>=1.0",

  # Clustering
  "hdbscan>=0.8.33",
  "parc>=0.8",
  "flowsom>=0.2",

  # PDF reports
  "reportlab>=4.0",

  # API
  "fastapi>=0.110",
  "starlette>=0.37",
  "pydantic>=2.0",

  "uvicorn[standard]>=0.29"

]


[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]

docs = [
  "sphinx>=7.0",
  "sphinx-autodoc-typehints>=2.0",
  "myst-parser>=2.0",
  "sphinx-copybutton>=0.5",
  "furo>=2024.1"
]

dev = [
  "ruff>=0.5",
  "mypy>=1.8",
  "pre-commit>=3.7"
]


[project.urls]
Homepage = "https://github.com/TarikExner/alloviewer"
Repository = "https://github.com/TarikExner/alloviewer"
Issues = "https://github.com/TarikExner/alloviewer/issues"


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = ["."]
include = ["alloviewer*"]


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config"
]


[tool.coverage.run]
source = ["alloviewer"]
branch = true


[tool.coverage.report]
show_missing = true
skip_covered = true


[tool.ruff]
line-length = 88
target-version = "py310"


[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP"
]
ignore = []


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
