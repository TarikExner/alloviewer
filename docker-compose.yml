services:
  redis:
    image: redis:7
    container_name: alloviewer_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    image: ${BACKEND_IMAGE:-alloviewer-backend:local}
    build: .
    container_name: alloviewer_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: "/data"
      REDIS_URL: "redis://redis:6379/0"
      PLATE_LAYOUT_STORE: "/data/plate_layouts"
      TORCH_DEVICE: "${TORCH_DEVICE:-cpu}"
    volumes:
      - "${HOST_DATA_DIR}:/data"
    depends_on:
      - redis

  worker_cpu:
    image: ${BACKEND_IMAGE:-alloviewer-backend:local}
    build: .
    container_name: alloviewer_worker_cpu
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker -Q cpu --loglevel=info --pool=solo --concurrency=1
    environment:
      DATA_DIR: "/data"
      REDIS_URL: "redis://redis:6379/0"
      PLATE_LAYOUT_STORE: "/data/plate_layouts"
      C_FORCE_ROOT: "true"
      TORCH_DEVICE: "cpu"
    volumes:
      - "${HOST_DATA_DIR}:/data"
    depends_on:
      - redis

  worker_image_cpu:
    image: ${BACKEND_IMAGE:-alloviewer-backend:local}
    build: .
    container_name: alloviewer_worker_image_cpu
    restart: unless-stopped
    profiles:
      - cpu
    command: celery -A app.workers.celery_app.celery_app worker -Q image --loglevel=info --pool=solo --concurrency=1
    environment:
      DATA_DIR: "/data"
      REDIS_URL: "redis://redis:6379/0"
      PLATE_LAYOUT_STORE: "/data/plate_layouts"
      C_FORCE_ROOT: "true"
      TORCH_DEVICE: "cpu"
    volumes:
      - "${HOST_DATA_DIR}:/data"
    depends_on:
      - redis

  worker_image_gpu:
    image: ${BACKEND_IMAGE:-alloviewer-backend:local}
    build: .
    container_name: alloviewer_worker_image_gpu
    restart: unless-stopped
    profiles:
      - gpu
    command: celery -A app.workers.celery_app.celery_app worker -Q image --loglevel=info --pool=solo --concurrency=1
    environment:
      DATA_DIR: "/data"
      REDIS_URL: "redis://redis:6379/0"
      PLATE_LAYOUT_STORE: "/data/plate_layouts"
      C_FORCE_ROOT: "true"
      TORCH_DEVICE: "${TORCH_DEVICE:-auto}"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    volumes:
      - "${HOST_DATA_DIR}:/data"
    depends_on:
      - redis
    gpus: all

  worker_maintenance:
    image: ${BACKEND_IMAGE:-alloviewer-backend:local}
    build: .
    container_name: alloviewer_worker_maintenance
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker -Q maintenance --loglevel=info --pool=solo --concurrency=1
    environment:
      DATA_DIR: "/data"
      REDIS_URL: "redis://redis:6379/0"
      PLATE_LAYOUT_STORE: "/data/plate_layouts"
      C_FORCE_ROOT: "true"
      TORCH_DEVICE: "cpu"
    volumes:
      - "${HOST_DATA_DIR}:/data"
    depends_on:
      - redis

  beat:
    image: ${BACKEND_IMAGE:-alloviewer-backend:local}
    build: .
    container_name: alloviewer_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    environment:
      DATA_DIR: "/data"
      REDIS_URL: "redis://redis:6379/0"
      PLATE_LAYOUT_STORE: "/data/plate_layouts"
      C_FORCE_ROOT: "true"
      TORCH_DEVICE: "cpu"
    volumes:
      - "${HOST_DATA_DIR}:/data"
    depends_on:
      - redis

  caddy:
    image: caddy:2
    container_name: alloviewer_caddy
    restart: unless-stopped
    profiles:
      - caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  redis_data:
  caddy_data:
  caddy_config:
